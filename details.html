<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./details.css">
    <title>Details - I Love Art</title>
</head>
<body>
    <div class="nav">
        <h2 class="logo" id="logo">I &lt;3 Art</h2>
        <div class="search">
            <input type="search" id="searchInput" placeholder="Search artworks...">
            <button id="searchBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
            </button>
        </div>
        <a href="./index.html" class="favorite-link">Favorites</a>
    </div>
    <div class="main">
        <div id="artwork-details" class="artwork-details">
            <h1 id="artwork-title">Artwork Title</h1>
            <div class="divider">
                <img id="artwork-image" src="" alt="Artwork Image">
                <div class="container">
                    <p id="artwork-description" class="description">Artwork Description</p>
                    <p id="artwork-artist" class="artwork-artist">Artist Name</p>
                    <p id="artwork-date" class="artwork-date">Date Display</p>
                    <p id="artwork-type" class="artwork-type">Artwork Type</p>
                    <button id="cardFavorite" class="cardFavorite">Add to Favorites</button>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        <p>&copy; <script>document.write(new Date().getFullYear())</script> I Love Art. All rights reserved.</p>
        <p>
            <a href="#">Privacy Policy</a> |
            <a href="#">Terms of Service</a> |
            <a href="#">Contact</a>
        </p>
    </div>
    <script src="./details.js"></script>
</body>
</html>
